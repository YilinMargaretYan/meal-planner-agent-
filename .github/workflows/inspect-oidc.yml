name: Inspect GitHub OIDC claims

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Print safe OIDC claims
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          request = urllib.request.Request(
              url,
              headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]},
          )
          token = json.load(urllib.request.urlopen(request))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          visible_claims = {
              key: claims.get(key)
              for key in [
                  "sub",
                  "aud",
                  "repository",
                  "repository_id",
                  "repository_owner",
                  "repository_owner_id",
                  "ref",
              ]
          }
          print(json.dumps(visible_claims, indent=2))
          PY