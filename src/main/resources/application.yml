spring:
  application:
    name: harness-agent
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/diet_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.diet.model
  configuration:
    map-underscore-to-camel-case: true
server:
  port: 8080
agentscope:
  openai:
    api-key: ${OPENAI_API_KEY}
diet:
  llm:
    main-model: gpt-5.2
    light-model: gpt-5.2
  session:
    max-history-turns: 10
  rag:
    embedding:
      # Runs only after V3 migration; all failures fall back to tag retrieval.
      enabled: true
      model: text-embedding-3-small
      candidate-limit: 10
logging:
  level:
    com.diet: INFO
